<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <!-- Background -->
  <rect width="320" height="200" fill="#f5f5f5" rx="8"/>
  <!-- Building body -->
  <rect x="90" y="80" width="140" height="90" fill="#e0e0e0" rx="4"/>
  <!-- Roof -->
  <polygon points="80,80 160,40 240,80" fill="#ff6b00" opacity="0.85"/>
  <!-- Door -->
  <rect x="140" y="130" width="40" height="40" fill="#bdbdbd" rx="3"/>
  <circle cx="175" cy="152" r="3" fill="#757575"/>
  <!-- Windows -->
  <rect x="100" y="95" width="30" height="25" fill="#90caf9" rx="2"/>
  <rect x="190" y="95" width="30" height="25" fill="#90caf9" rx="2"/>
  <!-- Sign board -->
  <rect x="120" y="58" width="80" height="18" fill="#ff6b00" rx="3"/>
  <text x="160" y="71" font-family="Arial,sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="bold">RESTAURANT</text>
  <!-- Label -->
  <text x="160" y="185" font-family="Arial,sans-serif" font-size="11" fill="#9e9e9e" text-anchor="middle">No Image Available</text>
</svg>
