{% extends "base.html" %}
{% block title %}Add Restaurant — Admin{% endblock %}
{% block content %}
<div class="page-header"><div class="container"><h1>Add Restaurant</h1></div></div>
<section class="section">
    <div class="container container-narrow">
        <div class="form-card">
            <form method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label>Restaurant Name *</label>
                        <input type="text" name="name" class="form-control" required placeholder="e.g. Pizza Palace">
                    </div>
                    <div class="form-group">
                        <label>Cuisine Type</label>
                        <input type="text" name="cuisine_type" class="form-control" placeholder="e.g. Italian, Indian">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" name="email" class="form-control" required placeholder="restaurant@email.com">
                    </div>
                    <div class="form-group">
                        <label>Password *</label>
                        <input type="password" name="password" class="form-control" required minlength="6">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" name="phone" class="form-control" placeholder="+91 ...">
                    </div>
                    <div class="form-group">
                        <label>Delivery Fee (₹)</label>
                        <input type="number" name="delivery_fee" class="form-control" value="30" min="0" step="0.01">
                    </div>
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <textarea name="address" class="form-control" rows="2" placeholder="Restaurant address"></textarea>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" class="form-control" rows="2" placeholder="Brief description"></textarea>
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" name="image_url" class="form-control" placeholder="https://...">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-lg">Add Restaurant</button>
                    <a href="{{ url_for('admin.restaurants') }}" class="btn btn-outline btn-lg">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
